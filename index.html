const getLastClauseOrChunk = (str) => {
    if (!str)
        return "";
    const clauses = str
        .split(/[.!؟?,،\n]+/)
        .map((s) => s.trim())
        .filter(Boolean);
    const lastClause = clauses[clauses.length - 1] || str.trim();
    const words = lastClause.split(/\s+/);
    return words.length > 7 ? words.slice(-6).join(" ") : lastClause;
};

// تنسيق الثواني إلى (MM:SS) أو (HH:MM:SS)
const formatDuration = (totalSeconds) => {
    const safeSec = Math.max(0, Math.floor(totalSeconds || 0));
    const hours = Math.floor(safeSec / 3600);
    const mins = Math.floor((safeSec % 3600) / 60);
    const secs = safeSec % 60;
    const pad = (n) => String(n).padStart(2, "0");
    if (hours > 0) {
        return `${pad(hours)}:${pad(mins)}:${pad(secs)}`;
    }
    return `${pad(mins)}:${pad(secs)}`;
};

// دالة فورية (0ms) لجلب المعنى العربي والبدائل لأي كلمة مصححة يتم الضغط عليها
function getInstantWordDetails(wordItem) {
    if (!wordItem)
        return null;
    const rightClean = (wordItem.rightGerman || "").trim().toLowerCase();
    const preset = INSTANT_WORD_ALTERNATIVES[rightClean];
    const fallbackWords = rightClean
        .split(/\s+/)
        .map((w) => GERMAN_TO_ARABIC_QUICK[w])
        .filter(Boolean)
        .join(" ");
    const arabicMeaning = wordItem.arabicMeaning ||
        preset?.arabicMeaning ||
        (wordItem.wrongOrArabic && /[\u0600-\u06FF]/.test(wordItem.wrongOrArabic)
            ? wordItem.wrongOrArabic
            : fallbackWords || "الصيغة الألمانية الصحيحة في هذا السياق");
    const alternatives = wordItem.alternatives && wordItem.alternatives.length > 0
        ? wordItem.alternatives
        : preset?.alternatives || [
            { de: wordItem.rightGerman, ar: "التعبير الأدق والأكثر طبيعية هنا" }
        ];
    return {
        wrongOrArabic: wordItem.wrongOrArabic,
        rightGerman: wordItem.rightGerman,
        arabicMeaning,
        alternatives
    };
}

// محلل محلي فوري (0ms) يعمل أثناء التحدث قبل وصول رد الـ API
// ==========================================
function buildLocalInstantPreview(rawText, currentResult) {
    const trimmed = (rawText || "").trim();
    if (!trimmed)
        return null;
    const replacedWords = [];
    let draftGerman = trimmed;
    let detectedArabicChunk = null;
    const sortedArabicKeys = Object.keys(LOCAL_INSTANT_DICTIONARY).sort((a, b) => b.length - a.length);
    for (const arKey of sortedArabicKeys) {
        if (draftGerman.includes(arKey)) {
            const entry = LOCAL_INSTANT_DICTIONARY[arKey];
            draftGerman = draftGerman.split(arKey).join(entry.de);
            const preset = INSTANT_WORD_ALTERNATIVES[entry.de.toLowerCase()];
            replacedWords.push({
                wrongOrArabic: arKey,
                rightGerman: entry.de,
                arabicMeaning: preset?.arabicMeaning || arKey,
                alternatives: preset?.alternatives || [
                    { de: entry.articleDe, ar: `الأصل: ${arKey} (${entry.pron})` }
                ]
            });
            detectedArabicChunk = {
                hasArabic: true,
                arabicSpoken: arKey,
                germanEquivalent: entry.articleDe,
                arabicPronunciation: entry.pron
            };
        }
    }
    if (/ich\s+bin\s+kalt/i.test(draftGerman)) {
        draftGerman = draftGerman.replace(/ich\s+bin\s+kalt/gi, "Mir ist kalt");
        replacedWords.push({
            wrongOrArabic: "Ich bin kalt",
            rightGerman: "Mir ist kalt",
            arabicMeaning: "أنا أشعر بالبرد",
            alternatives: INSTANT_WORD_ALTERNATIVES["mir ist kalt"].alternatives
        });
    }
    if (/trinke\s+eine\s+zigarette/i.test(draftGerman)) {
        draftGerman = draftGerman.replace(/trinke/gi, "rauche");
        replacedWords.push({
            wrongOrArabic: "trinke",
            rightGerman: "rauche",
            arabicMeaning: "أدخن",
            alternatives: INSTANT_WORD_ALTERNATIVES["rauche"].alternatives
        });
    }
    const tokens = draftGerman
        .replace(/[.!?,،؟]/g, "")
        .split(/\s+/)
        .filter(Boolean);
    const translatedTokens = tokens.map((tok) => {
        const clean = tok.toLowerCase();
        if (GERMAN_TO_ARABIC_QUICK[clean])
            return GERMAN_TO_ARABIC_QUICK[clean];
        return tok;
    });
    const hasAnyArabicChars = /[\u0600-\u06FF]/.test(trimmed);
    const isLocallyModified = replacedWords.length > 0 || hasAnyArabicChars;
    return {
        userSentence: trimmed,
        isCorrect: !isLocallyModified && (currentResult?.isCorrect ?? true),
        correctedGerman: draftGerman,
        arabicMeaning: translatedTokens.join(" ") ||
            currentResult?.arabicMeaning ||
            "جاري الترجمة اللحظية...",
        lastArabicChunk: detectedArabicChunk ||
            currentResult?.lastArabicChunk || {
            hasArabic: false,
            arabicSpoken: "",
            germanEquivalent: "",
            arabicPronunciation: ""
        },
        replacedWords: replacedWords.length > 0
            ? replacedWords
            : currentResult?.replacedWords || [],
        contextAndLogic: currentResult?.contextAndLogic ||
            "يتم تحليل السياق والمنطق لحظياً مع كلامك...",
        similarExamples: currentResult?.similarExamples || [],
        isLiveDraft: true
    };
}

// ==========================================
// دالة موحدة ومضمونة 100% للاتصال بـ Gemini API مع التبديل التلقائي للموديل الاحتياطي
// ==========================================
async function callGeminiWithFallback({
    activeKey,
    userText,
    systemInstruction,
    responseSchema,
    temperature = 0.1,
    signal,
    fastThinkingZero = false
}) {
    const cleanKey = (activeKey || "").trim();
    if (!cleanKey) {
        throw new Error("NO_API_KEY");
    }

    const modelsToTry = ["gemini-2.5-flash", "gemini-2.0-flash"];
    let lastErr = null;

    for (const modelName of modelsToTry) {
        try {
            const genConfig = {
                responseMimeType: "application/json",
                responseSchema,
                temperature
            };
            if (fastThinkingZero && modelName.includes("2.5")) {
                genConfig.thinkingConfig = { thinkingBudget: 0 };
            }

            const payload = {
                contents: [{ role: "user", parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: genConfig
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal
            });

            if (!response.ok) {
                const errBody = await response.text().catch(() => "");
                throw new Error(`HTTP_${response.status}:${errBody}`);
            }

            const data = await response.json();
            const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawJson) {
                throw new Error("EMPTY_MODEL_RESPONSE");
            }
            return JSON.parse(rawJson);
        } catch (err) {
            if (err.name === "AbortError") throw err;
            lastErr = err;
        }
    }
    throw lastErr || new Error("API_FAILED");
}

                    normalizeKey(lastTurn.correctedGerman) ===
                        normalizeKey(result.correctedGerman)) {
                    return prev;
                }
                return [
                    ...prev,
                    {
                        ...result,
                        id: `turn-${Date.now()}`
                    }
                ];
            });
        }
        accumulatedSpeechRef.current = "";
        currentInterimRef.current = "";
        setLiveTranscript("");
        setInputText("");
        setSelectedWordPopup(null);
    };

    // تبديل الكلمة المصححة بأحد البدائل بضغطة واحدة فوراً
    const applyAlternativeWord = (targetTurnId, oldRightGerman, newAltDe) => {
        if (targetTurnId === "active" && result) {
            const updatedGerman = result.correctedGerman.replace(new RegExp(oldRightGerman.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), newAltDe);
            const updatedReplaced = (result.replacedWords || []).map((w) => w.rightGerman.toLowerCase() === oldRightGerman.toLowerCase()
                ? { ...w, rightGerman: newAltDe }
                : w);
            setResult({
                ...result,
                correctedGerman: updatedGerman,
                replacedWords: updatedReplaced
            });
        }
        else {
            setConversationTurns((prev) => prev.map((turn) => {
                if (turn.id !== targetTurnId)
                    return turn;
                const updatedGerman = turn.correctedGerman.replace(new RegExp(oldRightGerman.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), newAltDe);
                const updatedReplaced = (turn.replacedWords || []).map((w) => w.rightGerman.toLowerCase() === oldRightGerman.toLowerCase()
                    ? { ...w, rightGerman: newAltDe }
                    : w);
                return {
                    ...turn,
                    correctedGerman: updatedGerman,
                    replacedWords: updatedReplaced
                };
            }));
        }
        speakGerman(newAltDe);
        setSelectedWordPopup((prev) => prev ? { ...prev, rightGerman: newAltDe } : null);
    };

    // تحديث ذاكرة "آخر كلمة بالعربي" كلما وجدنا كلمة عربية جديدة في الجملة
    const syncLastArabicMemory = (resObj) => {
        if (resObj?.lastArabicChunk?.hasArabic &&
            resObj.lastArabicChunk.arabicSpoken &&
            resObj.lastArabicChunk.germanEquivalent) {
            setLastArabicMemory(resObj.lastArabicChunk);
            return;
        }
        if (resObj?.replacedWords?.length > 0) {
            const arabicItem = [...resObj.replacedWords]
                .reverse()
                .find((w) => /[\u0600-\u06FF]/.test(w.wrongOrArabic));
            if (arabicItem) {
                setLastArabicMemory({
                    hasArabic: true,
                    arabicSpoken: arabicItem.wrongOrArabic,
                    germanEquivalent: arabicItem.rightGerman,
                    arabicPronunciation: ""
                });
            }
        }
    };

    // ==========================================
    // 1. محرك التصحيح الفوري فائق السرعة ("طلقة") بالذكاء الاصطناعي
    // ==========================================
    const runInstantCorrection = async (rawText, isBackgroundStream = false, customKeyOverride = null) => {
        const trimmed = (rawText || "").trim();
        if (!trimmed || trimmed.length < 2)
            return;
        const norm = normalizeKey(trimmed);
        if (norm === lastAnalyzedTextRef.current && result && !result.isLiveDraft) {
            return;
        }

        // 1. فحص الذاكرة الفورية (0ms)
        if (INSTANT_CACHE.has(norm)) {
            if (abortControllerRef.current)
                abortControllerRef.current.abort();
            const cached = INSTANT_CACHE.get(norm);
            lastAnalyzedTextRef.current = norm;
            setResult({ ...cached, userSentence: trimmed, isLiveDraft: false });
            syncLastArabicMemory(cached);
            setLatencyMs(8);
            setIsAnalyzing(false);
            setErrorMsg(null);
            return;
        }

        const keyToUse = (customKeyOverride ?? userApiKey ?? "").trim();
        if (!keyToUse) {
            setIsAnalyzing(false);
            if (!isBackgroundStream) {
                setShowApiPanel(true);
                setErrorMsg("🔑 يرجى إدخال مفتاح Gemini API في خانة (ربط الـ API) بالأعلى لتشغيل التصحيح الذكي 100%.");
            }
            return;
        }

        // 2. إلغاء أي طلب سابق لم يكتمل لتوفير أقصى سرعة
        if (abortControllerRef.current) {
            abortControllerRef.current.abort();
        }
        const controller = new AbortController();
        abortControllerRef.current = controller;
        setIsAnalyzing(true);
        setErrorMsg(null);
        const startTime = performance.now();
        const lastSpokenFocus = getLastClauseOrChunk(trimmed);
        const systemInstruction = `أنت مصحح ومترجم ألماني لحظي فائق السرعة للمتحدثين بالعربية.
- إذا كانت الجملة بالألمانية بالكامل وصحيحة نحوياً ومنطقياً 100% اجعل isCorrect: true.
- إذا كان فيها أي خطأ أو كلمة عربية، اجعل isCorrect: false وضع البديل الألماني الطبيعي في correctedGerman.
- هام جداً في replacedWords: ضع كل كلمة خاطئة أو عربية في wrongOrArabic، وضع الكلمة أو العبارة البديلة لها في rightGerman بحيث تكون مطابقة حرفياً لما كتبته داخل correctedGerman ليتم تظليلها بالأخضر، وضع معناها بالعربي في arabicMeaning، و3 بدائل ألمانية لها في نفس السياق مع معناها بالعربي في alternatives.
- إذا احتوى كلام المستخدم على أي كلمة أو عبارة بالعربية، ضعها في lastArabicChunk (hasArabic: true) مع مقابلها الألماني (مع der/die/das للأسماء) ونطقها بالعربي.
- في contextAndLogic اكتب جملة واحدة مختصرة جداً.
- هام جداً في similarExamples: أعطِ 6 أمثلة ألمانية قصيرة وطبيعية تخص تحديداً آخر جملة أو آخر مقطع قاله المستخدم وهو: "${lastSpokenFocus}".`;

        try {
            const parsed = await callGeminiWithFallback({
                activeKey: keyToUse,
                userText: trimmed,
                systemInstruction,
                responseSchema: FAST_CORRECTION_SCHEMA,
                temperature: 0.05,
                signal: controller.signal,
                fastThinkingZero: true
            });

            const finalResult = {
                ...parsed,
                userSentence: trimmed,
                isLiveDraft: false
            };
            const elapsed = Math.max(65, Math.round(performance.now() - startTime));
            INSTANT_CACHE.set(norm, finalResult);
            lastAnalyzedTextRef.current = norm;
            setResult(finalResult);
            syncLastArabicMemory(finalResult);
            setLatencyMs(elapsed);
            setApiTestStatus("connected");
            setErrorMsg(null);
        }
        catch (err) {
            if (err.name === "AbortError")
                return;
            if (!isBackgroundStream) {
                setErrorMsg("⚠️ تعذر الاتصال بالذكاء الاصطناعي. تأكد من صحة مفتاح الـ API في خانة (ربط الـ API) بالأعلى.");
            }
        }
        finally {
            if (abortControllerRef.current === controller) {
                setIsAnalyzing(false);
            }
        }
    };

    // ==========================================
    // مراقبة النص: ترجمة فورية 0ms أثناء الكلام + تأكيد كامل بعد التوقف أو أثناء الجملة
    // ==========================================
    const handleTextChange = (newText, options = {}) => {
        const { immediate = false, isSpeakingLive = false } = options;
        setInputText(newText);
        if (debounceTimerRef.current)
            clearTimeout(debounceTimerRef.current);
        const trimmed = (newText || "").trim();
        if (!trimmed) {
            setIsAnalyzing(false);
            return;
        }
        const norm = normalizeKey(trimmed);
        if (INSTANT_CACHE.has(norm)) {
            runInstantCorrection(trimmed);
            return;
        }
        const localPreview = buildLocalInstantPreview(trimmed, result);
        if (localPreview) {
            setResult(localPreview);
            syncLastArabicMemory(localPreview);
        }
        const now = Date.now();
        if (isSpeakingLive && now - liveStreamThrottleRef.current > 850 && trimmed.length >= 4) {
            liveStreamThrottleRef.current = now;
            runInstantCorrection(trimmed, true);
        }
        const waitTime = immediate
            ? 40
            : isSpeakingLive
                ? pauseWaitMs
                : 220;
        debounceTimerRef.current = setTimeout(() => {
            runInstantCorrection(trimmed, false);
        }, waitTime);
    };

    // ==========================================
    // 2. الميكروفون اللحظي المستمر (لا ينقطع أثناء التفكير!)
    // ==========================================
    const stopAllRecognition = () => {
        activeMicModeRef.current = "off";
        currentInterimRef.current = "";
        if (recognitionRef.current) {
            try {
                recognitionRef.current.onend = null;
                recognitionRef.current.onerror = null;
                recognitionRef.current.stop();
            }
            catch (_) { }
            recognitionRef.current = null;
        }
        setMicMode("off");
        setLiveTranscript("");
    };

    const startLiveSpeech = (langCode = "de") => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
            setErrorMsg("متصفحك لا يدعم التعرف الصوتي، يمكنك الكتابة وسيتم التصحيح تلقائياً فوراً.");
            return;
        }
        if (activeMicModeRef.current === langCode) {
            stopAllRecognition();
            if (inputText.trim()) {
                runInstantCorrection(inputText.trim(), false);
            }
            return;
        }
        if (recognitionRef.current) {
            try {
                recognitionRef.current.onend = null;
                recognitionRef.current.stop();
            }
            catch (_) { }
            recognitionRef.current = null;
        }
        setErrorMsg(null);
        activeMicModeRef.current = langCode;
        setMicMode(langCode);
        const isDefaultSentence = normalizeKey(inputText) === "ich möchte تذكرة سفر nach berlin حجز";
        if (langCode === "de" && isDefaultSentence) {
            accumulatedSpeechRef.current = "";
            setInputText("");
        }
        else {
            accumulatedSpeechRef.current = inputText.trim();
        }
        const launchRecognitionInstance = () => {
            if (activeMicModeRef.current === "off")
                return;
            const rec = new SpeechRec();
            const currentMode = activeMicModeRef.current;
            rec.lang = currentMode === "ar" ? "ar-EG" : "de-DE";
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;
            rec.onresult = (event) => {
                let sessionFinal = "";
                let sessionInterim = "";
                for (let i = 0; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        sessionFinal += transcript + " ";
                    }
                    else {
                        sessionInterim += transcript;
                    }
                }
                const currentSessionText = `${sessionFinal}${sessionInterim}`.trim();
                currentInterimRef.current = currentSessionText;
                setLiveTranscript(sessionInterim || sessionFinal);
                if (currentSessionText) {
                    const fullCombined = accumulatedSpeechRef.current
                        ? `${accumulatedSpeechRef.current} ${currentSessionText}`.trim()
                        : currentSessionText;
                    handleTextChange(fullCombined, {
                        immediate: false,
                        isSpeakingLive: true
                    });
                }
            };
            rec.onerror = (e) => {
                if (e.error === "no-speech") {
                    return;
                }
                if (e.error === "not-allowed" || e.error === "service-not-allowed") {
                    stopAllRecognition();
                    setErrorMsg("يرجى السماح بصلاحية الميكروفون في المتصفح.");
                }
            };
            rec.onend = () => {
                if (currentInterimRef.current) {
                    accumulatedSpeechRef.current = accumulatedSpeechRef.current
                        ? `${accumulatedSpeechRef.current} ${currentInterimRef.current}`.trim()
                        : currentInterimRef.current;
                    currentInterimRef.current = "";
                }
                if (activeMicModeRef.current !== "off") {
                    try {
                        launchRecognitionInstance();
                    }
                    catch (_) {
                        setMicMode("off");
                        activeMicModeRef.current = "off";
                    }
                }
                else {
                    setLiveTranscript("");
                }
            };
            recognitionRef.current = rec;
            try {
                rec.start();
            }
            catch (_) { }
        };
        launchRecognitionInstance();
    };

    // ==========================================
    // 3. نظام تشغيل وإيقاف/قفل الصوت الفوري (Stop Audio Anywhere)
    // ==========================================
    const stopSpeaking = () => {
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        setPlayingText(null);
    };

    // نطق الألمانية بصوت واضح + إذا ضغط المستخدم على نفس الجملة الشغالة يقفل الصوت فوراً
    const speakGerman = (text) => {
        if (activeMicModeRef.current !== "off" || micMode !== "off") {
            stopAllRecognition();
        }
        if (!text || !("speechSynthesis" in window))
            return;

        // إذا كانت هذه الجملة شغالة الآن وضغط عليها المستخدم مرة أخرى، نقفل الصوت فوراً!
        if (playingText === text) {
            stopSpeaking();
            return;
        }

        window.speechSynthesis.cancel();
        setPlayingText(text);
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE";
        u.rate = 0.95;
        u.onend = () => setPlayingText(null);
        u.onerror = () => setPlayingText(null);
        window.speechSynthesis.speak(u);
    };

    // توليد ونسخ كود التضمين الكامل الجاهز لـ Google Sites (Embed Code)
    const getGoogleSitesEmbedHtml = () => {
        return `<!DOCTYPE html>

  <script>

      window.speechSynthesis.cancel();

      u.lang = 'de-DE';
      window.speechSynthesis.speak(u);
    };
    rightText.onclick = () => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      } else {
        speakBtn.onclick();

    };
    micBtn.onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;

  <\/script>

    };

    const copyGoogleSitesCode = () => {
        const code = getGoogleSitesEmbedHtml();
        const textarea = document.createElement("textarea");
        textarea.value = code;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        setCopiedEmbed(true);
        setTimeout(() => setCopiedEmbed(false), 2500);
    };

    // ==========================================
    // تظليل الكلمات الخاطئة أو العربية بالأحمر داخل الجملة الحمراء
    // ==========================================
    const renderHighlightedWrongSentence = (sentence, replacedWords = []) => {
        if (!sentence)
            return null;
        if (!replacedWords || replacedWords.length === 0) {
            return React.createElement("span", null, sentence);
        }
        let parts = [sentence];
        let keyCounter = 0;
        replacedWords.forEach((wordObj, wordIdx) => {
            const { wrongOrArabic } = wordObj;
            const target = (wrongOrArabic || "").trim();
            if (!target)
                return;
            const nextParts = [];
            parts.forEach((part) => {
                if (typeof part !== "string") {
                    nextParts.push(part);
                    return;
                }
                const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(`(${escaped})`, "gi");
                const split = part.split(regex);

                    if (chunk.toLowerCase() === target.toLowerCase()) {
                        keyCounter += 1;
                        const details = getInstantWordDetails(wordObj);
                        const isSelected = selectedWordPopup &&
                            selectedWordPopup.turnId === "active" &&
                            selectedWordPopup.rightGerman?.toLowerCase() ===
                                wordObj.rightGerman?.toLowerCase();
                        nextParts.push(React.createElement("button", { type: "button", key: `wrong-${wordIdx}-${keyCounter}`, onClick: (e) => {
                                e.stopPropagation();
                                setSelectedWordPopup(isSelected
                                    ? null
                                    : {
                                        ...details,
                                        turnId: "active"
                                    });
                                speakGerman(wordObj.rightGerman);
                            }, title: `اضغط لرؤية الصح (${wordObj.rightGerman}) ومعناها وبدائلها فوراً`, className: `px-2 py-0.5 rounded-lg underline decoration-wavy mx-0.5 font-extrabold inline-flex items-center gap-1 transition-all cursor-pointer active:scale-95 ${isSelected
                                ? "bg-amber-400 text-slate-950 decoration-slate-950 ring-4 ring-amber-400/40"

                    else if (chunk) {
                        nextParts.push(chunk);

                });
            });
            parts = nextParts;
        });
        return parts;
    };

    // ==========================================
    // تظليل الكلمات المصححة باللون الأخضر وعلامة (✓)
    // ==========================================
    const renderHighlightedCorrectSentence = (sentence, replacedWords = [], turnId = "active") => {
        if (!sentence)

        let parts = [sentence];
        let keyCounter = 0;
        validRightWords.forEach((wordObj, wordIdx) => {
            const { rightGerman } = wordObj;
            const target = rightGerman.trim();
            if (!target)
                return;
            const nextParts = [];
            parts.forEach((part) => {
                if (typeof part !== "string") {
                    nextParts.push(part);

                }
                const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(`(${escaped})`, "gi");

                        const isSelected = selectedWordPopup &&
                            selectedWordPopup.turnId === turnId &&

                                target.toLowerCase();
                        nextParts.push(React.createElement("button", { type: "button", key: `right-${turnId}-${wordIdx}-${keyCounter}`, onClick: (e) => {
                                e.stopPropagation();
                                setSelectedWordPopup(isSelected

                            }, title: "\u0627\u0636\u063A\u0637 \u0644\u0639\u0631\u0636 \u0627\u0644\u0645\u0639\u0646\u0649 \u0628\u0627\u0644\u0639\u0631\u0628\u064A \u0648\u0627\u0644\u0628\u062F\u0627\u0626\u0644 \u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064A\u0629 \u0641\u0648\u0631\u0627\u064B", className: `px-2.5 py-0.5 rounded-xl border-2 underline decoration-2 font-black shadow-md inline-flex items-center gap-1 mx-1 transition-all cursor-pointer active:scale-95 ${isSelected
                                ? "bg-amber-400 text-slate-950 border-amber-200 decoration-slate-950 ring-4 ring-amber-400/30"
                                : "bg-emerald-400/30 hover:bg-emerald-400/45 text-emerald-100 border-emerald-400/80 decoration-emerald-300"}` },
                            React.createElement(Check, { className: `w-4 h-4 stroke-[3] shrink-0 ${isSelected ? "text-slate-950" : "text-emerald-300"}` }),
